<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Work Orders | screenings4u</title><link rel="stylesheet" href="/assets/theme.css"><script defer src="/config.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#f1f5fa;color:#183653;font:14px/1.6 Arial,sans-serif;margin:0}.wo-layout{max-width:1000px;margin:35px auto;padding:25px}.wo-card{background:white;border:1px solid #d7e1ee;border-radius:12px;padding:23px;margin:15px 0}h1{color:#325aa3}button,.back{border:1px solid #ced9e8;padding:11px 15px;background:white;color:#325aa3;border-radius:8px;cursor:pointer}button:hover{background:#eef4fb}.wo-head{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.wo-tag{background:#ecf3fc;padding:4px 8px;border-radius:6px}.wo-row{border-bottom:1px solid #eef2f6;padding:10px 0}.wo-tot{font-size:20px;font-weight:bold}.wo-muted{color:#667c91}.wo-table{width:100%;border-collapse:collapse}.wo-table td,.wo-table th{padding:10px;text-align:left;border-bottom:1px solid #eef2f6}</style></head><body><main class="wo-layout"><div class="wo-head"><div><h1>My Work Orders</h1><p class="wo-muted">Review the work orders emailed to your verified account.</p></div><a class="back" href="/selector.html">← Back to Portal Selector</a></div><div id="message" role="status">Loading your work orders…</div><section id="orders"></section><section id="detail"></section></main><script>
window.addEventListener('load',async()=>{const msg=document.getElementById('message'),root=document.getElementById('orders'),detail=document.getElementById('detail');try{const cfg=window.S4U_ACCESS_CONFIG;if(!cfg)throw Error('Portal configuration unavailable');const client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{storageKey:cfg.authStorageKey,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session}}=await client.auth.getSession();if(!session){location.replace('/?reason=session');return}const call=async(action,id)=>{const {data,error}=await client.functions.invoke('global-work-orders',{body:{action,id}});if(error||data?.error)throw Error(data?.error||error?.message||'Unable to load work orders');return data};const text=(tag,v)=>{const n=document.createElement(tag);n.textContent=String(v??'');return n};const list=await call('my_orders');msg.textContent=(list.work_orders||[]).length+' work order(s)';for(const w of list.work_orders||[]){const card=document.createElement('article');card.className='wo-card';card.append(text('h2',w.work_order_title||w.work_order_number),text('p',w.work_order_number+' · '+w.business_surface.toUpperCase()+' · '+w.status));const button=text('button','View Work Order');button.onclick=async()=>{try{const d=await call('my_order',w.id);const o=d.work_order;detail.replaceChildren();const panel=document.createElement('article');panel.className='wo-card';panel.append(text('h2',o.work_order_title),text('p','Work Order: '+o.work_order_number),text('p','Status: '+o.status),text('p','Customer: '+(o.contact_name||'')),text('p','Site: '+[o.site_name,o.address_line_1,o.city,o.state,o.postal_code].filter(Boolean).join(', ')),text('p','Requested: '+(o.requested_date||'To be confirmed')+' '+(o.requested_start_time||'')));const table=document.createElement('table');table.className='wo-table';const head=document.createElement('tr');['Service','Qty','Amount'].forEach(x=>head.append(text('th',x)));table.append(head);for(const item of d.services||[]){const tr=document.createElement('tr');[item.service_name,item.quantity,'$'+Number(item.line_total).toFixed(2)].forEach(x=>tr.append(text('td',x)));table.append(tr)}panel.append(table,text('p','Total: $'+Number(o.total||0).toFixed(2)),text('p','Instructions: '+(o.special_instructions||'None')),text('p','Terms: '+(o.terms_and_conditions||'None')));detail.append(panel);detail.scrollIntoView({behavior:'smooth'})}catch(e){msg.textContent=e.message}};card.append(button);root.append(card)}if(!list.work_orders?.length)root.append(text('p','No work orders have been sent to this email address yet.'))}catch(e){msg.textContent=e.message}});
</script></body></html>
